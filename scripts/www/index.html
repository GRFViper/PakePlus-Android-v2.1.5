        window.onerror = function(msg, url, lineNo, columnNo, error) {
          var errInfo = error ? (error.stack || error.message) : 'No error object';

            'Message: ' + msg,
            'URL: ' + url,
            'Line: ' + lineNo,
            'Column: ' + columnNo,
            'Details: ' + errInfo
          ].join('\n');
          alert('JS Error Detected:\n\n' + message);
          return false;
        };
        // 捕获 Promise 错误
        window.addEventListener('unhandledrejection', function(event) {
          alert('Unhandled Promise Rejection:\n' + event.reason);
        });
        console.log('Error capture script initialized');
      })();
